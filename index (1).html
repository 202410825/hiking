<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Hiking · 도장판</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #DCEBF7; }
  body { font-family: 'Noto Sans KR', sans-serif; }
  button { font-family: inherit; }

  @keyframes idle-bob { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-6px) rotate(1deg); } }
  .avatar-idle { animation: idle-bob 2.4s ease-in-out infinite; }

  @keyframes pop { 0% { transform: scale(0.6); opacity: 0; } 60% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }
  .pop-in { animation: pop 0.4s cubic-bezier(.34,1.56,.64,1); }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;

/* ── 블루 팔레트 ───────────────────────── */
const P = {
  bg: "#EAF4FC",
  deep: "#0F3D68",
  primary: "#2E6FBF",
  primarySoft: "#DCEAFB",
  sky: "#7FB8E8",
  card: "#FFFFFF",
  line: "#CFE2F5",
  text: "#1F3350",
  sub: "#6C87A6",
  gold: "#E3A93F",
};

const CATEGORY = {
  식당:   { emoji: "🍚" },
  카페:   { emoji: "☕" },
  산책로: { emoji: "🌲" },
  학교건물:{ emoji: "🏫" },
  관광지: { emoji: "🏯" },
};

const INITIAL_SPOTS = [
  { id: 1, name: "정문 광장",     category: "학교건물", stamped: true,  method: "위치+사진", reward: "책갈피",     desc: "상명대 정문. 하루의 시작을 알리는 첫 관문." },
  { id: 2, name: "단골 카페 이든", category: "카페",   stamped: true,  method: "QR",       reward: "커피 쿠폰",   desc: "수업 사이 짬에 들르기 좋은 학생 단골 카페." },
  { id: 3, name: "홍제천 산책길", category: "산책로", stamped: true,  method: "위치+사진", reward: "수뭉이 키링", desc: "후문에서 이어지는 하천길. 노을 무렵 추천." },
  { id: 4, name: "청계천",       category: "관광지", stamped: false, method: "위치+사진", reward: "배민 쿠폰",   desc: "도심 속 물길. 밤 산책 코스로 강추." },
  { id: 5, name: "경복궁",       category: "관광지", stamped: false, method: "QR",       reward: "책갈피",     desc: "야간 개장 시기엔 인생샷 명소." },
];

/* 개인 캐릭터 겸 도장 - 작은 버전 (스탬프 대용) */
function MiniAvatar({ size = 30 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 40 40">
      <circle cx="12" cy="9" r="2.6" fill={P.primary} />
      <circle cx="28" cy="9" r="2.6" fill={P.primary} />
      <line x1="12" y1="9" x2="15" y2="15" stroke={P.primary} strokeWidth="2" strokeLinecap="round" />
      <line x1="28" y1="9" x2="25" y2="15" stroke={P.primary} strokeWidth="2" strokeLinecap="round" />
      <circle cx="20" cy="21" r="13" fill="#EAF4FC" stroke={P.primary} strokeWidth="2.4" />
      <circle cx="15.5" cy="20" r="1.8" fill={P.text} />
      <circle cx="24.5" cy="20" r="1.8" fill={P.text} />
      <path d="M15 24 Q20 28 25 24" stroke={P.text} strokeWidth="1.6" fill="none" strokeLinecap="round" />
      <circle cx="12.5" cy="24" r="2" fill="#F3B6C4" opacity="0.7" />
      <circle cx="27.5" cy="24" r="2" fill="#F3B6C4" opacity="0.7" />
    </svg>
  );
}

/* 개인 캐릭터 - 풀바디 버전 (다음 도전 유도용) */
function HeroAvatar({ bounce }) {
  return (
    <div className={bounce ? "avatar-idle" : ""} style={{ width: 92, filter: "drop-shadow(0 6px 6px rgba(15,61,104,0.18))" }}>
      <svg width="92" height="122" viewBox="0 0 92 122">
        <ellipse cx="46" cy="116" rx="26" ry="5" fill="rgba(15,61,104,0.12)" />
        <line x1="24" y1="18" x2="30" y2="32" stroke={P.primary} strokeWidth="4" strokeLinecap="round" />
        <line x1="68" y1="18" x2="62" y2="32" stroke={P.primary} strokeWidth="4" strokeLinecap="round" />
        <circle cx="24" cy="18" r="5.5" fill={P.sky} />
        <circle cx="68" cy="18" r="5.5" fill={P.sky} />
        <path d="M46 100 C24 100 16 84 18 66 C20 46 30 34 46 34 C62 34 72 46 74 66 C76 84 68 100 46 100 Z"
              fill={P.primarySoft} stroke={P.primary} strokeWidth="3.5" />
        <circle cx="34" cy="58" r="4.4" fill={P.text} />
        <circle cx="58" cy="58" r="4.4" fill={P.text} />
        <path d="M32 68 Q46 82 60 68" stroke={P.text} strokeWidth="3" fill="none" strokeLinecap="round" />
        <circle cx="26" cy="66" r="5" fill="#F3B6C4" opacity="0.75" />
        <circle cx="66" cy="66" r="5" fill="#F3B6C4" opacity="0.75" />
      </svg>
    </div>
  );
}

function SeasonBanner() {
  return (
    <div style={{ position: "relative", margin: "18px 20px 8px" }}>
      <svg viewBox="0 0 360 78" width="100%" height="78" style={{ display: "block" }}>
        <defs>
          <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stopColor={P.primary} />
            <stop offset="100%" stopColor="#3F86D6" />
          </linearGradient>
        </defs>
        <path d="M0 12 L28 39 L0 66 L338 66 L360 39 L338 12 Z" fill="url(#ribbon)" />
      </svg>
      <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", color: "#fff", padding: "0 40px" }}>
        <div style={{ fontFamily: "'Jua', sans-serif", fontSize: 18, letterSpacing: 1 }}>이번 시즌 안내</div>
        <div style={{ fontSize: 11.5, marginTop: 2, opacity: 0.9 }}>홍제천 · 청계천 일대 (9.1 ~ 9.30)</div>
      </div>
    </div>
  );
}

function SpotRow({ spot, onSelect, big }) {
  const meta = CATEGORY[spot.category];
  return (
    <button
      onClick={() => onSelect(spot)}
      style={{
        width: "100%", display: "flex", alignItems: "center", gap: 14,
        background: "none", border: "none", cursor: "pointer", padding: "10px 20px",
        textAlign: "left",
      }}
    >
      <div style={{
        width: big ? 64 : 52, height: big ? 64 : 52, borderRadius: "50%", flexShrink: 0,
        display: "flex", alignItems: "center", justifyContent: "center",
        background: spot.stamped ? P.primarySoft : "#F4F9FE",
        border: spot.stamped ? `2.5px solid ${P.primary}` : `2px dashed ${P.line}`,
      }}>
        {spot.stamped ? <div className="pop-in"><MiniAvatar size={big ? 42 : 34} /></div> : <span style={{ fontSize: big ? 26 : 20 }}>{meta.emoji}</span>}
      </div>
      <div style={{ flex: 1, background: P.card, border: `1px solid ${P.line}`, borderRadius: 14, padding: "10px 14px" }}>
        <div style={{ fontSize: 14, fontWeight: 700, color: P.text }}>{spot.name}</div>
        <div style={{ fontSize: 12, color: P.sub, marginTop: 2, lineHeight: 1.4 }}>{spot.desc}</div>
      </div>
    </button>
  );
}

function FeaturedNextSpot({ spot, onSelect, bounce }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 12, margin: "6px 20px 14px" }}>
      <button
        onClick={() => onSelect(spot)}
        style={{ flex: 1, textAlign: "left", background: P.card, border: `1.5px dashed ${P.sky}`, borderRadius: 16, padding: "14px 16px", cursor: "pointer" }}
      >
        <div style={{ fontSize: 11, color: P.primary, fontWeight: 700, marginBottom: 4 }}>다음 도전 장소</div>
        <div style={{ fontSize: 15, fontWeight: 700, color: P.text }}>{spot.name}</div>
        <div style={{ fontSize: 12, color: P.sub, marginTop: 4, lineHeight: 1.5 }}>{spot.desc}</div>
      </button>
      <HeroAvatar bounce={bounce} />
    </div>
  );
}

function DetailSheet({ spot, onClose, onConquer }) {
  if (!spot) return null;
  const meta = CATEGORY[spot.category];
  const methodEmoji = spot.method === "QR" ? "🔳" : spot.method === "NFC" ? "📡" : "📸";
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(15,61,104,0.4)", display: "flex", alignItems: "flex-end", zIndex: 50 }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} style={{ width: "100%", maxWidth: 380, margin: "0 auto", background: P.bg, borderTopLeftRadius: 22, borderTopRightRadius: 22, padding: "22px 22px 26px", boxShadow: "0 -6px 24px rgba(0,0,0,0.2)" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <div style={{ width: 40, height: 40, borderRadius: "50%", background: P.primarySoft, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20 }}>{meta.emoji}</div>
            <div>
              <div style={{ fontFamily: "'Jua', sans-serif", fontSize: 18, color: P.deep }}>{spot.name}</div>
              <div style={{ fontSize: 12, color: P.sub }}>{spot.category}</div>
            </div>
          </div>
          <button onClick={onClose} style={{ background: "none", border: "none", cursor: "pointer", fontSize: 20, color: P.text }}>✕</button>
        </div>
        <p style={{ marginTop: 14, fontSize: 14, lineHeight: 1.6, color: P.text }}>{spot.desc}</p>
        <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
          <div style={{ flex: 1, background: P.primarySoft, borderRadius: 12, padding: "10px 12px", fontSize: 12.5, color: P.text }}>{methodEmoji} 인증 · {spot.method}</div>
          <div style={{ flex: 1, background: "#FFF6E6", border: `1px solid ${P.gold}`, borderRadius: 12, padding: "10px 12px", fontSize: 12.5, color: P.text }}>🎁 {spot.reward}</div>
        </div>
        <button
          onClick={() => !spot.stamped && onConquer(spot)}
          style={{ marginTop: 18, width: "100%", padding: "13px 0", borderRadius: 14, border: "none",
            background: spot.stamped ? P.primarySoft : P.primary, color: spot.stamped ? P.primary : "#fff",
            fontWeight: 700, fontSize: 15, cursor: spot.stamped ? "default" : "pointer" }}
        >
          {spot.stamped ? "이미 정복한 장소예요" : "여기서 인증하기"}
        </button>
      </div>
    </div>
  );
}

function BoardScreen({ spots, onSelect, bounce }) {
  const stampedList = spots.filter((s) => s.stamped);
  const nextSpot = spots.find((s) => !s.stamped);
  const restList = spots.filter((s) => !s.stamped && s.id !== (nextSpot && nextSpot.id));

  return (
    <div style={{ paddingBottom: 20 }}>
      <SeasonBanner />
      <div style={{ display: "flex", flexDirection: "column", gap: 6, marginTop: 10 }}>
        {stampedList.map((s) => <SpotRow key={s.id} spot={s} onSelect={onSelect} />)}
      </div>
      {nextSpot && <FeaturedNextSpot spot={nextSpot} onSelect={onSelect} bounce={bounce} />}
      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
        {restList.map((s) => <SpotRow key={s.id} spot={s} onSelect={onSelect} />)}
      </div>
      <div style={{ textAlign: "center", color: P.sub, fontSize: 18, letterSpacing: 4, marginTop: 6 }}>⋮</div>
    </div>
  );
}

function MapScreen({ spots, onSelect }) {
  const pos = [{ top: "20%", left: "28%" }, { top: "38%", left: "68%" }, { top: "58%", left: "24%" }, { top: "72%", left: "62%" }, { top: "86%", left: "40%" }];
  return (
    <div style={{ padding: "16px 20px" }}>
      <div style={{ position: "relative", width: "100%", height: 320, borderRadius: 18, overflow: "hidden", background: "#D8E9F8", border: `1px solid ${P.line}` }}>
        <svg width="100%" height="100%" viewBox="0 0 320 320" preserveAspectRatio="none">
          <path d="M0,90 C80,60 120,140 200,110 C260,90 300,130 320,100" stroke={P.sky} strokeWidth="10" fill="none" opacity="0.5" />
          <path d="M40,0 C60,80 20,160 60,240 C90,300 40,320 40,320" stroke={P.sky} strokeWidth="8" fill="none" opacity="0.5" />
          <circle cx="90" cy="190" r="46" fill={P.primarySoft} opacity="0.6" />
          <circle cx="230" cy="70" r="34" fill={P.primarySoft} opacity="0.5" />
        </svg>
        {spots.map((s, i) => {
          const meta = CATEGORY[s.category];
          return (
            <button key={s.id} onClick={() => onSelect(s)} style={{ position: "absolute", ...pos[i], transform: "translate(-50%,-100%)", background: "none", border: "none", cursor: "pointer" }}>
              <div style={{ width: 34, height: 34, borderRadius: "50% 50% 50% 0", transform: "rotate(45deg)", background: s.stamped ? P.primary : "#fff", border: `2px solid ${P.primary}`, display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "0 2px 6px rgba(0,0,0,0.2)" }}>
                <div style={{ transform: "rotate(-45deg)", fontSize: 14 }}>{meta.emoji}</div>
              </div>
            </button>
          );
        })}
      </div>
    </div>
  );
}

function CommunityScreen() {
  const REVIEWS = [
    { id: 1, name: "산책러버", spot: "청계천", text: "저녁 8시쯤 가니까 조명 켜지고 진짜 예뻐요.", likes: 24 },
    { id: 2, name: "카페인중독", spot: "단골 카페 이든", text: "시험기간엔 콘센트 자리 경쟁 치열해요.", likes: 11 },
  ];
  return (
    <div style={{ padding: "16px 20px", display: "flex", flexDirection: "column", gap: 12 }}>
      {REVIEWS.map((r) => (
        <div key={r.id} style={{ background: P.card, borderRadius: 16, padding: 14, border: `1px solid ${P.line}` }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <div style={{ width: 28, height: 28, borderRadius: "50%", background: P.primary, color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 700 }}>{r.name[0]}</div>
            <div style={{ fontSize: 13, fontWeight: 700, color: P.text }}>{r.name}</div>
            <div style={{ fontSize: 11.5, color: P.sub, marginLeft: "auto" }}>📍 {r.spot}</div>
          </div>
          <p style={{ marginTop: 8, fontSize: 13, color: P.text, lineHeight: 1.5 }}>{r.text}</p>
          <div style={{ marginTop: 6, fontSize: 12, color: P.sub }}>❤️ {r.likes}</div>
        </div>
      ))}
    </div>
  );
}

function App() {
  const [spots, setSpots] = useState(INITIAL_SPOTS);
  const [selected, setSelected] = useState(null);
  const [tab, setTab] = useState("board");
  const [bounce, setBounce] = useState(true);

  const stampedCount = spots.filter((s) => s.stamped).length;

  const conquer = (spot) => {
    setSpots((prev) => prev.map((s) => (s.id === spot.id ? { ...s, stamped: true } : s)));
    setSelected(null);
    setBounce(false);
    setTimeout(() => setBounce(true), 50);
  };

  const TABS = [
    { id: "map", label: "지도", emoji: "🗺️" },
    { id: "board", label: "도장판", emoji: "🪧" },
    { id: "check", label: "인증", emoji: "📷" },
    { id: "community", label: "커뮤니티", emoji: "💬" },
    { id: "setting", label: "설정", emoji: "⚙️" },
  ];

  return (
    <div style={{ background: P.bg, minHeight: "100vh", display: "flex", justifyContent: "center" }}>
      <div style={{ width: "100%", maxWidth: 400, minHeight: "100vh", position: "relative" }}>
        <div style={{ padding: "20px 20px 4px", position: "sticky", top: 0, zIndex: 10, background: P.bg }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div style={{ fontFamily: "'Jua', sans-serif", fontSize: 22, color: P.deep }}>Hiking</div>
            <div style={{ display: "flex", alignItems: "center", gap: 6, background: P.card, border: `1px solid ${P.primary}`, borderRadius: 20, padding: "5px 12px" }}>
              <MiniAvatar size={20} />
              <span style={{ fontSize: 12.5, fontWeight: 700, color: P.text }}>{stampedCount}/{spots.length}</span>
            </div>
          </div>
        </div>

        <div style={{ paddingBottom: 90 }}>
          {tab === "board" && <BoardScreen spots={spots} onSelect={setSelected} bounce={bounce} />}
          {tab === "map" && <MapScreen spots={spots} onSelect={setSelected} />}
          {tab === "community" && <CommunityScreen />}
          {tab === "check" && <div style={{ padding: 40, textAlign: "center", color: P.sub, fontSize: 13.5 }}>인증 사진 기록은 다음 단계에서 채워질 예정이에요.</div>}
          {tab === "setting" && <div style={{ padding: 40, textAlign: "center", color: P.sub, fontSize: 13.5 }}>개인정보 · 설정 화면은 다음 단계에서 채워질 예정이에요.</div>}
        </div>

        <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, maxWidth: 400, margin: "0 auto", background: "#fff", borderTop: `1px solid ${P.line}`, display: "flex", padding: "10px 4px" }}>
          {TABS.map((t) => {
            const active = tab === t.id;
            return (
              <button key={t.id} onClick={() => setTab(t.id)} style={{ flex: 1, background: "none", border: "none", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 3, color: active ? P.primary : P.sub, padding: "4px 0" }}>
                <span style={{ fontSize: 18 }}>{t.emoji}</span>
                <span style={{ fontSize: 10.5, fontWeight: active ? 700 : 500 }}>{t.label}</span>
              </button>
            );
          })}
        </div>

        <DetailSheet spot={selected} onClose={() => setSelected(null)} onConquer={conquer} />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
